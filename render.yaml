services:
  - type: web
    name: discord-ai-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: PORT
        value: 8080
    healthCheckPath: /health
    autoDeploy: true